    <style>
      .welcome-container {
        text-align: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: top 100px;
      }
      .welcome-txt {
        font-size: 50px;
        font-weight: bold;
        margin: 0;
      }
      .word-welcome {
        color: #6f42c1;
        display: inline-block;
        animation: fadeInFadeUp 2s ease-out forwards;
      }
      .word-back {
        color: #007bff;
        display: inline-block;
        animation: fadeInFadeUp 2s ease-out forwards;
        opacity: 0;
      }
       @keyframes fadeInFadeUp {
            0% {
                opacity: 0;             
                transform: translateY(30px);
            }
            100% {
                opacity: 1;         
                transform: translateY(0);    
            }
        }
    </style>
  </head>
  <body>
        <div class="welcome-container">
        <h1 class="welcome-text">
            <span class="word-welcome">Welcome</span>
            <span class="word-back">Back!</span>
        </h1>
    </div>
